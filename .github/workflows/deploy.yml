# GitHub Actions 自动部署（Docker 版）

name: Deploy with Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TX_HOST }}
          username: ${{ secrets.TX_USER }}
          key: ${{ secrets.TX_KEY }}
          script: |
            cd ~/www/github/llm
            
            # 拉取最新代码
            git pull origin main
            
            # 停止并重建容器（数据卷保留）
            docker compose down
            docker compose up -d --build
            
            # 查看运行状态
            docker compose ps
            
            # 查看日志（最近 10 行）
            docker compose logs --tail=10
