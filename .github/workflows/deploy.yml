name: Deploy with uv

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TX_HOST }}
          username: ${{ secrets.TX_USER }}
          key: ${{ secrets.TX_KEY }}
          script: |
            cd ~/www/github/llm
            git pull origin main
            # 先停止服务，避免 Chroma 底层 SQLite 句柄未释放导致 rm 不彻底
            sudo systemctl stop llm-qa llm-agent || true
            # 清理旧向量库及可能残留的 SQLite WAL/SHM 锁文件
            rm -rf rag/chroma_db rag/md5.txt
            uv sync --frozen
            # 同步 systemd 服务文件（防止服务器重装后丢失）
            sudo cp deploy/systemd/llm-qa.service /etc/systemd/system/
            sudo cp deploy/systemd/llm-agent.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl restart llm-qa llm-agent
